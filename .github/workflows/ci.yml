name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Runs without submodules so dashboard/script faults are still reported when
  # a submodule checkout breaks.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate dashboards against provisioned datasources
        run: python3 scripts/validate-dashboards.py
      - name: Validate helper scripts
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            for script in scripts/*.sh; do
              if head -1 "$script" | grep -q 'bash'; then bash -n "$script"; else sh -n "$script"; fi
            done
          fi

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # The umbrella overrides services that come from `include:`, which the
      # whole v2 line rejects with "conflicts with imported resource". Runners
      # ship v2, so install the version the stack actually needs.
      - name: Install Docker Compose v5
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-x86_64
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      # The sub-projects refuse to start without their secrets, so generate them the way a
      # user does. `make setup` also needs Compose v5, installed above.
      - name: Generate secrets (make setup)
        run: make setup
      - name: Validate Compose model
        run: docker compose config --format json >/tmp/xib-compose.json
      - name: Every published port must be bound to an explicit interface
        run: python3 scripts/check-port-bindings.py /tmp/xib-compose.json
      - name: No mutable image tags (default path; its scanners may still mount the socket)
        run: python3 scripts/check-image-policy.py --allow-socket /tmp/xib-compose.json
      - name: Safe path - no mutable tags and NO Docker socket mounts (read-only proxy overlay)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.read-only-proxy.yml config --format json >/tmp/xib-safe.json
          python3 scripts/check-image-policy.py /tmp/xib-safe.json
          python3 scripts/check-port-bindings.py /tmp/xib-safe.json
